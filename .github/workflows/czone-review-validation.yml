name: CZone review staging validation
on:
  push:
    branches:
      - feat/czone-pgn-review-revision
permissions:
  contents: write
jobs:
  validate-and-generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - name: Install generation dependencies
        run: sudo apt-get update && sudo apt-get install -y xsltproc libxml2-utils python3-setuptools
      - name: Validate source and tests
        run: |
          keel/keel check
          make tests
      - name: Regenerate artifacts
        run: make generated
      - name: Check contract
        run: make pr
      - name: Commit generated artifacts
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -u
            git commit -m "chore: regenerate CZone PGN artifacts"
            git push origin HEAD:${{ github.ref_name }}
          fi
